name: 节点数据更新

on:
  schedule:
    # 每 3 小时一次，取第 17 分（避开整点拥堵）
    # GitHub 的 cron 在整点前后延迟最严重，偏移 17 分钟能显著降低迟到/丢执行概率
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只允许一个采集任务，避免两个 run 同时 push 冲突
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要历史来判断数据新鲜度

      # 闸门：如果数据 2 小时内刚更新过，直接跳过（应对 cron 延迟导致的重复执行）
      - name: 新鲜度闸门
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，跳过闸门"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          last=$(git log -1 --format=%ct -- data/nodes.json 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ -z "$last" ] || [ "$last" = "0" ]; then
            echo "无历史记录，执行"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          age=$(( (now - last) / 60 ))
          echo "距上次数据更新：${age} 分钟"
          if [ $((now - last)) -lt 7200 ]; then
            echo "数据够新（<120 分钟），跳过本次"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: 采集并重建页面
        if: steps.gate.outputs.skip != 'true'
        run: python3 collector.py

      - name: 提交更新
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "node-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data/ "订阅 全部节点 base64.txt" "订阅 全部节点 明文.txt"
          if git diff --cached --quiet; then
            echo "内容无变化，不提交"
            exit 0
          fi
          git commit -m "chore: 更新节点 $(date '+%Y-%m-%d %H:%M')"
          git push

      # jsDelivr 有 12 小时缓存，push 后主动清一次，备用入口才能立刻看到新内容
      - name: 清理 jsDelivr 缓存
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -sf --max-time 30 -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d '{"path":["https://cdn.jsdelivr.net/gh/BOB0098/nodes@main/index.html","https://cdn.jsdelivr.net/gh/BOB0098/nodes@main/data/nodes.json"]}' \
            || echo "purge 失败（可忽略，12 小时内会自动刷新）"
