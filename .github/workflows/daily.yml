name: 每日更新节点数据

on:
  schedule:
    - cron: '0 22 * * *'    # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 采集并重建页面
        run: python3 collector.py

      - name: 提交更新
        run: |
          git config user.name "node-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html data/ "订阅 全部节点 base64.txt" "订阅 全部节点 明文.txt"
          git commit -m "chore: 更新节点 $(date '+%Y-%m-%d')" || echo "无变化"
          git push
