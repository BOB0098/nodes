name: 节点数据更新

on:
  schedule:
    # 每 3 小时一次，取第 17 分（避开整点拥堵）
    # GitHub 的 cron 在整点前后延迟最严重，偏移 17 分钟能显著降低迟到/丢执行概率
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # P22 失败通知：流水线失败时开/更新一个 issue。只为此授权 issues，
  # 其余动作仍是最小的 contents: write。
  issues: write

# runner 默认 UTC。页面上的时间是给人看的，统一按东八区渲染，
# 否则会出现「数据 07:17 更新 / 检测 23:32」这种自相矛盾的并排显示
env:
  TZ: Asia/Shanghai

# 同一时间只允许一个采集任务，避免两个 run 同时 push 冲突
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要历史来判断数据新鲜度

      # 闸门：如果数据 2 小时内刚更新过，直接跳过（应对 cron 延迟导致的重复执行）
      - name: 新鲜度闸门
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，跳过闸门"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          last=$(git log -1 --format=%ct -- data/nodes.json 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ -z "$last" ] || [ "$last" = "0" ]; then
            echo "无历史记录，执行"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          age=$(( (now - last) / 60 ))
          echo "距上次数据更新：${age} 分钟"
          if [ $((now - last)) -lt 7200 ]; then
            echo "数据够新（<120 分钟），跳过本次"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'

      # 少了这一步，`import yaml` 会在启动时直接失败，而且失败得很安静：
      # P2 之后连续多轮 CI 都挂在这里，页面数据其实是停的
      - name: 安装依赖
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # 出网边界自测：SSRF 拦截、大小/时长上限、日志脱敏、原子写。
      # 30 项，不到 1 秒。放在采集前面——这一层如果坏了，采集会在
      # 不知不觉中读到不该读的东西（或者把 10MB 的错误页当成订阅）。
      - name: 安全边界自测
        if: steps.gate.outputs.skip != 'true'
        run: python3 netsafe.py

      # P23：本轮开始，用 GITHUB_RUN_ID 建同轮台账。后续每个关键阶段成功
      # 后 mark 一笔，manifest 生成前 check——任一阶段失败就不会 mark，
      # 台账不完整 → check 失败 → 不 push，旧数据无法冒充新一轮。
      - name: 初始化同轮台账
        if: steps.gate.outputs.skip != 'true'
        run: python3 run_ledger.py start

      - name: 采集并重建页面
        if: steps.gate.outputs.skip != 'true'
        # 单源 150s 预算 × 15 源 / 6 并发，最坏约 6 分钟。给到 15 分钟：
        # 卡死时宁可这步失败、保留上一轮数据，也不要挂到 workflow 上限
        timeout-minutes: 15
        env:
          # 查「源最后提交时间」要打 14 次 GitHub API：带 token 5000/小时，不带只有 60
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 collector.py && python3 run_ledger.py mark collect

      # mihomo 二进制 21MB，每轮重下要 20-40 秒。版本号进 key，
      # 升级时自动失效，不会拿着旧内核测新协议
      - name: 缓存 mihomo
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ../.nodes-cache/mihomo
          key: mihomo-v1.19.34

      # 真实代理检测：TCP 端口能连不等于代理可用。抽样后交给 mihomo 真握手，
      # 能不能出网、延迟多少、出口在哪个国家，都从这条真实链路里量。
      # P23：去掉 continue-on-error——检测失败必须中断本轮，绝不拿上一轮的
      # nodecheck.json 冒充新检测结果继续发布。失败即保留远端上一版。
      - name: 真实代理检测
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 40
        # --speed 只对已经握手成功的节点下载 512KB 测速。不测的话评分里
        # 速度那 20 分恒为 0，可用节点的分数上限只有 75，最优选永远凑不够
        run: python3 nodecheck.py --speed && python3 run_ledger.py mark detect

      # 评分与地区分类：只统计 nodecheck 里测过的节点，没测过的一律不算可用。
      # 同时把本轮结果写进逐节点历史（data/node_history.json）与日趋势（trend.json）。
      - name: 节点评分与分类
        if: steps.gate.outputs.skip != 'true'
        run: python3 nodescore.py && python3 run_ledger.py mark score

      # 四类优选榜单。必须在订阅之前：订阅的 best/stable/lowlat/fast 四组
      # 直接读 picks.json 的成员与顺序，两边各筛一套就会出现
      # 「页面上排第一的节点不在订阅第一行」。
      # P19：重复仓库 / 镜像 / 内容重合识别 + 逐源指标 + 新源观察期。
      # 放在评分之后：状态直接取 score.py 的判定，治理层不再跑一遍状态机。
      - name: 来源治理与重复源识别
        if: steps.gate.outputs.skip != 'true'
        run: python3 governance.py && python3 run_ledger.py mark governance

      - name: 生成优选榜单
        if: steps.gate.outputs.skip != 'true'
        run: python3 picks.py && python3 run_ledger.py mark picks

      # 多格式订阅：Clash YAML / sing-box JSON / URI / Base64，按质量与地区分组。
      # 每种格式生成后立刻用自己的解析器读回来校验条数，只改扩展名不算输出成功。
      - name: 生成订阅（多格式）
        if: steps.gate.outputs.skip != 'true'
        run: python3 export_subs.py && python3 run_ledger.py mark subs

      # 重渲染放在订阅之后：页面要显示「优选 220 条」这类数字，就得先让
      # subscriptions.json 落盘。以前渲染在订阅之前，页面永远读上一轮的条数，
      # 于是同一轮出现 9,845 和 9,846 两个总数。
      # --render 现在会按新公式重算源评分，所以它同时也是「改公式后生效」的入口。
      - name: 重渲染页面
        if: steps.gate.outputs.skip != 'true'
        run: python3 collector.py --render && python3 run_ledger.py mark render

      # P23：manifest 之前先验同轮台账。任一关键阶段没成功 mark、run_id
      # 不一致、或阶段产物被改动，这里就退出码 1，job 中断、不 push——
      # 旧产物不会被打上新 build_id 冒充本轮。
      - name: 同轮构建校验
        if: steps.gate.outputs.skip != 'true'
        run: python3 run_ledger.py check

      # P20：所有产物落盘后钉一个统一 manifest。必须在 render 之后——
      # render 会改 index.html，manifest 记的哈希必须是最终版，否则一致性
      # 检查会拿旧哈希去比新页面，把正常一轮误判成「产物被改动」。
      - name: 生成统一构建清单
        if: steps.gate.outputs.skip != 'true'
        run: python3 build_manifest.py --write

      # P22 发布门禁之一：公开产物脱敏审计。若某个脚本改了输出字段，把带
      # uuid/password 的完整 URI 或明文 token 写进 data/*.json 或页面，
      # 这里命中即中断——异常凭据不会进公开仓库。
      - name: 公开产物脱敏审计
        if: steps.gate.outputs.skip != 'true'
        run: python3 audit_privacy.py

      # 发布门禁：页面、数据、订阅、状态必须同一轮同一个数，且产物哈希
      # 与 manifest 吻合。旧版时间正则认不出「2026-11-25 14:15」，把相差
      # 13 分钟的两份数据报成「差 0 分钟」；现在统一规范化 + 哈希硬校验。
      # 这一步没有 continue-on-error：失败即中断，下面的 git 提交不会执行，
      # 远端保留上一版可用产物。
      - name: 一致性检查
        if: steps.gate.outputs.skip != 'true'
        run: python3 check_consistency.py

      - name: 提交更新
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "node-bot"
          git config user.email "bot@users.noreply.github.com"
          # 只提交页面与脱敏数据。全量导出含凭据，已移到 export/ 并 gitignore，
          # 通过下面的 artifact 步骤交付，不入库。
          # docs/P4-source-quality.md 与 docs/P19-governance.md 每轮分别由 score.py / governance.py 重写，随数据一起提交
          # data/build_manifest.json 由本轮 build_manifest.py 生成，必须与产物同提交，
          # 否则下一轮一致性检查会拿旧哈希比新数据，把正常更新误判成篡改。
          git add index.html data/ docs/P4-source-quality.md docs/P19-governance.md docs/P20-subscriptions.md
          if git diff --cached --quiet; then
            echo "内容无变化，不提交"
            exit 0
          fi
          git commit -m "chore: 更新节点 $(date '+%Y-%m-%d %H:%M')"
          # 人工提交随时可能插进来（改代码、补文档），直接 push 会被拒。
          # 这一轮跑了十几分钟，因为一个 push 冲突把数据丢掉不值得。
          # 冲突时取本轮的数据：文件是刚生成的，远端那份一定是旧的。
          for i in 1 2 3; do
            git fetch -q origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              if git push; then exit 0; fi
            else
              echo "远端有新提交，合并后重试（$i/3）"
              git merge --no-edit -X ours origin/main
            fi
            sleep 5
          done
          echo "三次都没推上去，本轮数据未提交"; exit 1

      # 全量订阅导出含完整凭据，只作为本次 run 的产物保留 1 天，不进仓库
      - name: 上传订阅导出（含凭据，不入库）
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subscription-export
          path: export/
          retention-days: 1
          if-no-files-found: ignore

      # jsDelivr 有 12 小时缓存，push 后主动清一次，备用入口才能立刻看到新内容
      - name: 清理 jsDelivr 缓存
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -sf --max-time 30 -X POST https://purge.jsdelivr.net/ \
            -H "Content-Type: application/json" \
            -d '{"path":["https://cdn.jsdelivr.net/gh/BOB0098/nodes@main/index.html","https://cdn.jsdelivr.net/gh/BOB0098/nodes@main/data/nodes.json"]}' \
            || echo "purge 失败（可忽略，12 小时内会自动刷新）"

      # P22 失败通知：任一关键步骤失败时，在仓库开/更新一个带标签的 issue，
      # 让人第一时间知道「页面停在上一版了」。用 gh CLI（runner 自带，无外部
      # 依赖）+ GITHUB_TOKEN。去重：已有 open 的 ci-failure issue 就追加评论
      # 并保留首次标题，避免每 3 小时刷一条新 issue。
      # 通知本身失败不能反过来影响结论，所以 continue-on-error。
      - name: 失败通知
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="[流水线失败] 节点数据更新异常"
          body="时间：$(date -u '+%Y-%m-%d %H:%M UTC')，运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}。发布已中止，远端保留上一版可用产物。"
          # 标签不存在就建一次（已存在会报错，忽略即可）
          gh label create ci-failure --repo "$GITHUB_REPOSITORY" \
            --color d73a4a --description "自动化流水线失败" >/dev/null 2>&1 || true
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-failure --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body" \
              && echo "已在 issue #$existing 追加失败记录"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label ci-failure \
              && echo "已创建失败通知 issue"
          fi
