# ─────────────────────────────────────────────────────────────────────
# 来源登记表（唯一事实来源）
#
# 改这里就够了：collector.py 从这里读清单，页面卡片也从这里生成。
# 旧的 collector.py 里 GROUPS(14 张卡片) 与 SOURCES(9 个采集项) 是两份
# 互不对应的表，导致 7 张卡片没有统计数据、2 个源被采集却不展示。
#
# 字段说明（对齐任务书 §4「每个来源记录」）：
#   id        稳定标识，改 URL 也不改它（统计/健康记录按 id 归档）
#   name      展示名 / 采集日志名
#   url       页面卡片上给用户复制的地址（一定是仓库原版，不改写）
#   mirrors   备用拉取地址，按顺序 fallback；仅采集用，不给用户
#   type      original（源作者自己产数据）| aggregator（聚合多个源）
#   format    clash | v2ray-base64 | v2ray-plain | singbox-json | mixed
#   license   SPDX 标识；null = 仓库未声明（合规风险，页面/文档需标注）
#   priority  同组排序权重，越大越靠前（页面实际排序仍按「预计可用数」）
#   enabled   是否参与采集与展示。新源必须经 screen.py 审核后才置 true
#   card      页面卡片文案。cn:true = 国内直连常不通，沉底并加提示
#   note      维护备注：迁移、重合、风险等人工判断，供后续审计
#
# 动态字段（最近抓取/内容变化/各阶段条数/失败次数/质量评分）不写在这里，
# 由 collector.py 每轮写入 data/sources_stats.json，避免提交时大面积 diff。
# ─────────────────────────────────────────────────────────────────────
